name: Auto-Deploy Relates Social Media

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared validation package
        run: pnpm --filter validation run build

      - name: Run server tests
        run: pnpm --filter server run test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/relates-server:latest -f Dockerfile.server .
          docker push ghcr.io/${{ github.repository_owner }}/relates-server:latest

      - name: Build and push Caddy/Client Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/relates-client:latest -f Dockerfile.client .
          docker push ghcr.io/${{ github.repository_owner }}/relates-client:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/lynn/apps/relates

            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            git pull origin main

            docker compose -f docker-compose.yaml pull

            docker compose -f docker-compose.yaml up -d
